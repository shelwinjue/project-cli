apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: ${YOUR_PROJECT_NAME}
  name: ${YOUR_PROJECT_NAME}
  namespace: frontend
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      run: ${YOUR_PROJECT_NAME}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        run: ${YOUR_PROJECT_NAME}
    spec:
      containers:
        - image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          name: ${YOUR_PROJECT_NAME}
          env:
            - name: NODE_ENV
              value: 'development'
          resources:
            requests:
              cpu: '300m'
              memory: 512Mi
            limits:
              cpu: '500m'
              memory: 1024Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: zj-acr
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  labels:
    run: ${YOUR_PROJECT_NAME}
  name: ${YOUR_PROJECT_NAME}
  namespace: frontend
spec:
  externalTrafficPolicy: Local
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: ${YOUR_PROJECT_NAME}
      port: 80
      protocol: TCP
      targetPort: 80
      nodePort: 32453
  selector:
    run: ${YOUR_PROJECT_NAME}
  sessionAffinity: None
  type: NodePort
