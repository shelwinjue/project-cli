apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: ${APP_NAME}
  name: ${APP_NAME}
  namespace: frontend
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      run: ${APP_NAME}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        run: ${APP_NAME}
    spec:
      containers:
        - image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          name: ${APP_NAME}
          resources:
            requests:
              cpu: '100m'
              memory: 25Mi
            limits:
              cpu: '200m'
              memory: 50Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          startupProbe:
            httpGet:
              path: /index.html
              port: 80
            failureThreshold: 50
            periodSeconds: 10
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: zj-acr
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  labels:
    run: ${APP_NAME}
  name: ${APP_NAME}
  namespace: frontend
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: ${APP_NAME}
      port: 80
      protocol: TCP
      targetPort: 80
  selector:
    run: ${APP_NAME}
  sessionAffinity: None
  type: ClusterIP
